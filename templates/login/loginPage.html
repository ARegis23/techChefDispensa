{% extends "base.html" %}

{% block title %}Login - TechChef Despensa{% endblock %}

{% block content %}

<section>

    <h2>Login</h2>

    <p>
        Acesse o TechChef Despensa para gerenciar alimentos,
        usuários e configurações da aplicação.
    </p>

    <form id="form-login">

        <div>
            <label for="nome">Nome</label><br>

            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Use apenas para criar conta"
            >
        </div>

        <br>

        <div>
            <label for="email">E-mail</label><br>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
            >
        </div>

        <br>

        <div>
            <label for="senha">Senha</label><br>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                required
            >
        </div>

        <br>

        <button type="submit">
            Entrar com e-mail
        </button>

        <button type="button" id="btn-criar-conta">
            Criar conta
        </button>

        <hr>

        <button type="button" id="btn-google">
            Entrar com Google
        </button>

    </form>

    <p id="auth-message"></p>

    <p>
        <a href="{{ url_for('web.sobre') }}">
            Sobre o projeto
        </a>
    </p>

</section>

<script
    type="module"
    src="{{ url_for('static', filename='js/auth_login.js') }}">
</script>

{% endblock %}
