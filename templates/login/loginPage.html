{% extends "base.html" %}

{% block conteudo %}

<section class="card">
    <h2>Login</h2>

    <form method="POST">
        <label>Usuário</label>
        <input type="text" name="username" required>

        <label>Senha</label>
        <input type="password" name="senha" required>

        <button type="submit">Entrar</button>
    </form>
</section>

{% endblock %}
